<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button Icons demo</title>
<link rel="stylesheet" href="snippet.css">
<style>
  body{font-family:system-ui,sans-serif;padding:2rem;display:grid;gap:1.25rem;justify-items:start}
  .sqs-block-button-element{background:#111;color:#fff;padding:.9em 1.6em;text-decoration:none;border-radius:4px}
  .demo-big{--sp-icon-size:1.3em;--sp-icon-gap:.8em}
  .demo-color .sqs-block-button-element{background:#e4572e}
</style></head><body>
<div class="sp-btn-icons sp-icon-arrow"><a class="sqs-block-button-element" href="#">Get started</a></div>
<div class="sp-btn-icons sp-icon-plus"><a class="sqs-block-button-element" href="#">Add to cart</a></div>
<div class="sp-btn-icons sp-icon-download"><a class="sqs-block-button-element" href="#">Download PDF</a></div>
<div class="sp-btn-icons sp-icon-external demo-color demo-big"><a class="sqs-block-button-element" href="#">Visit site (bigger icon)</a></div>
</body></html>
